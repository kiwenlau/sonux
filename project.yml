name: Sonux
options:
  bundleIdPrefix: com.sonux
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  debug: debug
  release: release
schemes:
  Sonux:
    build:
      targets:
        Sonux: all
        SonuxWidget: build
        SonuxTests: [test]
    run:
      config: debug
      environment:
        XCTEnableTestActionDiagnostics: "YES"
    test:
      config: debug
      targets:
        - SonuxTests
      gatherCoverageData: true
      coverageFormat: xml
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  ViewInspector:
    url: https://github.com/nalexn/ViewInspector
    from: "0.9.9"
targets:
  Sonux:
    type: application
    platform: iOS
    sources:
      - App
      - Intents
      - Models
      - Services
      - Shared
      - Views
      - Support/Localizable.xcstrings
      # Siri 的说法不进 catalog（AppShortcuts.xcstrings 要 iOS 17 才认），用经典的逐语言 .strings
      - Support/AppShortcuts
    entitlements:
      path: Support/Sonux.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kiwenlau.sonux
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Sonux
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja, ko, fr, de, es, pt-BR, pt-PT, it, ru, ar, nl, sv, da, fi, nb, pl, tr, cs, sk, hu, el, he, hi, id, ms, ro, uk, th, vi, ca, hr]
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.kiwenlau.sonux
            CFBundleURLSchemes: [sonux]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        # 原地打开：导入走书签引用，必须拿到「文件」里那份原文件的路径；
        # 关掉它系统会把文档拷一份进沙盒，书签就指向那份临时副本了
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio Files
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiwenlau.sonux
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  SonuxWidget:
    # 桌面「正在收听」小组件：与主 App 共用 Localization / WidgetBridge 两份源码
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared/WidgetBridge.swift
      - App/Localization.swift
      - Support/Localizable.xcstrings
    dependencies:
      - target: Sonux
    entitlements:
      path: Support/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kiwenlau.sonux
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Sonux
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja, ko, fr, de, es, pt-BR, pt-PT, it, ru, ar, nl, sv, da, fi, nb, pl, tr, cs, sk, hu, el, he, hi, id, ms, ro, uk, th, vi, ca, hr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiwenlau.sonux.widget
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SKIP_INSTALL: "YES"
  SonuxTests:
    # 单元测试：走宿主打针（TEST_HOST=Sonux.app），能直接 @testable import Sonux 访问内部类型
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Sonux
      # ViewInspector：把 SwiftUI 视图的 body 反解成可断言的对象树
      # 0.9.9 是 iOS 16.4 部署目标下可用的稳定版
      - package: ViewInspector
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiwenlau.sonux.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sonux.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sonux"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "16.4"
        TARGETED_DEVICE_FAMILY: "1"
