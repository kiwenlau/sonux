name: Sonux
options:
  bundleIdPrefix: com.sonux
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Sonux:
    type: application
    platform: iOS
    sources:
      - App
      - Intents
      - Models
      - Services
      - Shared
      - Views
      - Support/Localizable.xcstrings
      # Siri 的说法不进 catalog（AppShortcuts.xcstrings 要 iOS 17 才认），用经典的逐语言 .strings
      - Support/AppShortcuts
    entitlements:
      path: Support/Sonux.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kiwenlau.sonux
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Sonux
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja, ko, fr, de, es, pt-BR, pt-PT, it, ru, ar, nl, sv, da, fi, nb, pl, tr, cs, sk, hu, el, he, hi, id, ms, ro, uk, th, vi, ca, hr]
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.kiwenlau.sonux
            CFBundleURLSchemes: [sonux]
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        # 原地打开：导入走书签引用，必须拿到「文件」里那份原文件的路径；
        # 关掉它系统会把文档拷一份进沙盒，书签就指向那份临时副本了
        LSSupportsOpeningDocumentsInPlace: true
        UIBackgroundModes:
          - audio
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio Files
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiwenlau.sonux
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
  SonuxWidget:
    # 桌面「正在收听」小组件：与主 App 共用 Localization / WidgetBridge 两份源码
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared/WidgetBridge.swift
      - App/Localization.swift
      - Support/Localizable.xcstrings
    dependencies:
      - target: Sonux
    entitlements:
      path: Support/Widget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kiwenlau.sonux
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Sonux
        CFBundleLocalizations: [en, zh-Hans, zh-Hant, ja, ko, fr, de, es, pt-BR, pt-PT, it, ru, ar, nl, sv, da, fi, nb, pl, tr, cs, sk, hu, el, he, hi, id, ms, ro, uk, th, vi, ca, hr]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kiwenlau.sonux.widget
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        SKIP_INSTALL: "YES"
